[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iada-net"
version = "1.0.0"
description = "Image-adaptive depth aggregation for whole-image breast ultrasound classification"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.6", "torchvision>=0.21", "timm>=1.0,<1.1",
  "numpy>=2.0,<3", "Pillow>=10", "opencv-python-headless>=4.10,<5",
  "albumentations>=2.0.8,<2.1", "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["iada*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
